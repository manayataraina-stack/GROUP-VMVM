<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Optional: Link to a CSS file for styling -->
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <h2>Login</h2>
    <div class="login-container">
        <!-- The action attribute specifies the server-side script URL -->
        <!-- The method attribute set to "POST" sends data securely -->
        <form action="login_process.php" method="POST">
            <div class="form-group">
                <label for="username">Username:</label>
                <!-- type="text" for the username/email input -->
                <input type="text" id="username" name="username" placeholder="Enter Username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <!-- type="password" to mask characters with dots or asterisks -->
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>
            <button type="submit">Login</button>
            <div class="form-options">
                <label>
                    <input type="checkbox" checked="checked" name="remember"> Remember me
                </label>
                <span class="psw">Forgot <a href="#">password?</a></span>
            </div>
        </form>
    </div>
</body>
</html>
