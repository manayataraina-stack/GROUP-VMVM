!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .cart-container {
            width: 70%;
            margin: 40px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f0f0f0;
        }
        input[type="number"] {
            width: 60px;
        }
        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .checkout-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 25px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .checkout-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="cart-container">
    <h2>Your Cart</h2>

    <table>
        <tr>
            <th>Product</th>
            <th>Price (₹)</th>
            <th>Quantity</th>
            <th>Total (₹)</th>
        </tr>
        <tr>
            <td>Yoga Leggings</td>
            <td>1200</td>
            <td><input type="number" value="1" min="1"></td>
            <td>1200</td>
        </tr>
        <tr>
            <td>Sports Bra</td>
            <td>800</td>
            <td><input type="number" value="1" min="1"></td>
            <td>800</td>
        </tr>
    </table>

    <div class="total">
        Grand Total: ₹2000
    </div>

    <button class="checkout-btn">Checkout</button>
</div>

</body>
</html>
